trigger:
  branches:
    include:
      - main
  tags:
    include:
      - v*

pr:
  branches:
    include:
      - main

parameters:
  - name: deployStub
    displayName: Build and run the local Compose deployment stub
    type: boolean
    default: true

stages:
  - stage: LintTest
    displayName: Lint, tests, and pin check
    jobs:
      - job: lint_test
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.12"
          - script: python -m pip install -r requirements.txt
            displayName: Install project requirements
          - script: ruff check .
            displayName: Lint
          - script: pytest -q
            displayName: Unit tests
          - script: python check_prompt_pin.py
            displayName: Verify prompt/config/MCP pins

  - stage: Eval
    dependsOn: LintTest
    condition: succeeded()
    jobs:
      - job: golden_eval
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.12"
          - script: python -m pip install -r requirements.txt
          - script: python eval_prompts.py --prompt-version 1.2.0 --min-agreement 0.85
            displayName: Stable golden evaluation
          - script: python eval_prompts.py --prompt-version 1.3.0-candidate --min-agreement 0.85
            displayName: Candidate golden evaluation

  - stage: McpHealth
    dependsOn: Eval
    condition: succeeded()
    jobs:
      - job: mcp_health
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.12"
          - script: python scripts/check_mcp_health.py --expected-version 1.2.0
            displayName: MCP handshake and required tools
          - script: |
              if python scripts/check_mcp_health.py --require-tool missing_required_tool; then
                echo "A missing required tool must fail the health probe" >&2
                exit 1
              else
                echo "Expected nonzero MCP gate observed"
              fi
            displayName: Prove failed MCP check blocks

  - stage: BuildDeployStub
    dependsOn: McpHealth
    condition: and(succeeded(), eq('${{ parameters.deployStub }}', 'true'))
    jobs:
      - job: build_deploy_stub
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.12"
          - script: |
              set -euo pipefail
              if [[ "${BUILD_SOURCEBRANCH}" == refs/tags/* ]]; then
                export ACTUAL_TAG="${BUILD_SOURCEBRANCH#refs/tags/}"
                python -c 'import json,os,sys; pin=json.load(open("prompts/pin.json")); actual=os.environ["ACTUAL_TAG"]; print("release tag={}, pinned={}".format(actual,pin["release_tag"])); sys.exit(actual != pin["release_tag"])'
              fi
              IMAGE_TAG=$(python -c 'import json; print(json.load(open("prompts/pin.json"))["image_tag"].split(":", 1)[1])')
              export IMAGE_TAG PROMPT_VERSION=1.2.0 APP_ENV=local-ci HOST_PORT=18765 PROMPT_CANARY_ENABLED=false
              docker compose -p afyaplus-week8-ci -f docker-compose.yml build
              docker compose -p afyaplus-week8-ci -f docker-compose.yml up --detach --wait --wait-timeout 45
              python scripts/check_runtime.py --base-url http://127.0.0.1:18765 --expected-prompt 1.2.0
              docker image inspect "afyaplus-week8:${IMAGE_TAG}" --format '{{.Id}}' | tee image-id.txt
              docker compose -p afyaplus-week8-ci -f docker-compose.yml logs --no-color > compose.log
              docker compose -p afyaplus-week8-ci -f docker-compose.yml down --remove-orphans
            displayName: Build, run health gates, record image ID, and tear down stub
          - publish: image-id.txt
            artifact: deploy-evidence
            condition: always()